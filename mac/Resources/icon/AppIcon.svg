<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#343D8F"/><stop offset="1" stop-color="#1C2150"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.5" cy="0" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/><stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD58C" stop-opacity="0.55"/><stop offset="0.45" stop-color="#F2A33A" stop-opacity="0.18"/><stop offset="1" stop-color="#F2A33A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC163"/><stop offset="1" stop-color="#E8892A"/>
    </linearGradient>
    <radialGradient id="dot" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#FFE3AE"/><stop offset="1" stop-color="#F2A33A"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <mask id="crescent">
      <rect width="1024" height="1024" fill="#000"/>
      <circle cx="685.9" cy="338.1" r="62" fill="#fff"/>
      <circle cx="715.9" cy="316.1" r="54" fill="#000"/>
    </mask>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sheen)"/>
    <rect x="101" y="101" width="822" height="822" rx="185" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2"/>
  </g>
  <circle cx="512" cy="512" r="246" fill="none" stroke="#4A53A8" stroke-opacity="0.45" stroke-width="58"/>
  <circle cx="512" cy="512" r="300" fill="url(#glow)"/>
  <circle cx="512" cy="512" r="246" fill="none" stroke="url(#amber)" stroke-width="58" stroke-linecap="round"
